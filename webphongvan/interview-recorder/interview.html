<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Recorder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 20px 0;
      font-family: 'Segoe UI', sans-serif;
    }
    .interview-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      padding: 35px;
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }
    .progress { height: 10px; border-radius: 10px; background: #e0e0e0; margin-bottom: 30px; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.6s ease; }
    .question-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 28px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(102,126,234,0.4);
    }
    #videoPreview {
      width: 100%; height: 420px; object-fit: cover; border-radius: 18px;
      background: #000; box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      position: relative;
    }

    /* ĐỒNG HỒ NHỎ + GÓC PHẢI TRÊN VIDEO */
    .timer-wrapper {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 90px;
      height: 90px;
      z-index: 10;
    }
    .timer-circle {
      width: 100%; height: 100%;
      background: conic-gradient(#667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .timer-inner {
      width: 78px; height: 78px;
      background: rgba(0,0,0,0.75);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: white !important;
    }

    .status { text-align: center; margin: 25px 0; font-size: 1.15rem; color: #444; font-weight: 500; }

    /* NÚT "BẮT ĐẦU GHI NGAY" – BIỂU TƯỢNG PLAY TRÒN */
    #skipPrepareBtn {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: #4361ee;
      border: none;
      font-size: 3.2rem;
      color: white;
      box-shadow: 0 12px 35px rgba(67,97,238,0.5);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #skipPrepareBtn:hover {
      transform: scale(1.12);
      box-shadow: 0 20px 50px rgba(67,97,238,0.7);
    }

    /* NÚT STOP – BIỂU TƯỢNG VUÔNG */
    #stopBtn {
      width: 60px; height: 60px;
      border-radius: 16px;
      background: #ef4444;
      border: none;
      font-size: 2rem;
      color: white;
      box-shadow: 0 8px 25px rgba(239,68,68,0.7);
      transition: all 0.3s;
    }
    #stopBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 40px rgba(239,68,68,0.7);
    }

    .thankyou {
      text-align: center;
      padding: 120px 20px;
      color: #333;
    }
    .thankyou h1 { font-size: 4rem; color: #667eea; font-weight: 900; }
  </style>
</head>
<body>
  <div id="interviewSection" class="interview-card">
    <div class="progress mb-4">
      <div id="progressBar" class="progress-bar" style="width:20%">1/5</div>
    </div>

    <div class="question-box">
      <div id="questionText">Câu hỏi sẽ hiển thị ở đây</div>
      <div class="mt-2">Câu <span id="currentQ">1</span> / <span id="totalQ">5</span></div>
    </div>

    <div class="text-center position-relative mb-4">
      <video id="videoPreview" autoplay muted playsinline></video>
      
      <!-- ĐỒNG HỒ Ở GÓC PHẢI TRÊN VIDEO -->
      <div class="timer-wrapper">
        <div class="timer-circle">
          <div class="timer-inner">
            <span id="timerDisplay" class="timer-text">01:00</span>
          </div>
        </div>
      </div>

      <p id="status" class="status mt-3">Sẵn sàng – Bấm nút để bắt đầu</p>
    </div>

    <!-- NÚT "BẮT ĐẦU GHI NGAY" – CHỈ HIỆN TRƯỚC KHI GHI (BIỂU TƯỢNG PLAY) -->
    <div class="text-center">
      <button id="skipPrepareBtn" class="btn d-none">
        ▶
      </button>
    </div>

    <!-- NÚT STOP – CHỈ HIỆN KHI ĐANG GHI (BIỂU TƯỢNG VUÔNG) -->
    <div class="text-center mt-4">
      <button id="stopBtn" class="btn d-none">
        ■
      </button>
    </div>

    <!-- CÁC NÚT KHÁC (BẮT BUỘC CHO recorder-v3.js) -->
    <div class="text-center mt-4">
      <button id="nextBtn" class="btn btn-primary btn-lg d-none">Tiếp tục →</button>
      <button id="retryBtn" class="btn btn-outline-secondary mt-3 d-none">Thử lại upload</button>
    </div>

    <div id="uploadStatus" class="mt-4"></div>
  </div>

  <!-- MÀN HÌNH CẢM ƠN -->
  <div id="thankyouSection" class="thankyou d-none">
    <h1>HOÀN TẤT PHỎNG VẤN!</h1>
    <p>Cảm ơn bạn đã tham gia ❤️</p>
    <p class="fs-4 mt-4">Bạn có thể đóng tab này.</p>
  </div>

  <script src="js/recorder-v3.js"></script>
</body>
</html>
