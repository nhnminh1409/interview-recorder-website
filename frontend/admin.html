<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Interview Recorder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; padding: 30px 0; }
    .card { box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 15px; }
    .session-card { transition: all 0.3s; cursor: pointer; }
    .session-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    .table th { font-size: 0.9rem; }
    .table td small { line-height: 1.4; }

    /* NÚT QUAY LẠI TRANG CHỦ – ĐẸP + RÕ RÀNG */
    .back-home-fixed {
      position: fixed;
      top: 10px;
      left: 5px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <!-- NÚT QUAY LẠI TRANG CHỦ CHO ADMIN -->
  <div class="back-home-fixed">
    <button onclick="backToHome()" class="btn btn-danger btn-lg rounded-pill shadow-lg">
      ← Home
    </button>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header bg-primary text-white text-center">
        <h2>ADMIN PANEL – Interview management</h2>
      </div>
      <div class="card-body">

        <!-- TIN NHẮN TỪ KHÁCH (CHỈ 7 CỘT) -->
        <div class="card mb-4 border-success">
          <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Messages from candidate</h4>
            <button onclick="loadMessages()" class="btn btn-sm btn-light">Refresh</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 520px;">
              <table class="table table-striped table-hover mb-0 align-middle">
                <thead class="table-success sticky-top">
                  <tr>
                    <th width="14%">Time</th>
                    <th width="16%">Name</th>
                    <th width="12%">Phone number</th>
                    <th width="10%">Year of birth</th>
                    <th width="18%">Email</th>
                    <th width="12%">You are</th>
                    <th>Content</th>
                    <th width="8%">Action</th> <!-- 🧠 PHẢI CÓ DÒNG NÀY -->
                  </tr>
                </thead>
                <tbody id="messagesTable">
                  <tr><td colspan="7" class="text-center py-4 text-muted">Loading messages...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <!-- HẾT PHẦN TIN NHẮN -->

        <div id="sessionList" class="row">
          <!-- Danh sách buổi phỏng vấn sẽ hiện ở đây -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal chi tiết buổi phỏng vấn -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Interview details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // BẢO VỆ TRANG ADMIN
    if (sessionStorage.getItem('isAdmin') !== 'true') {
      alert('You do not have permission to access this page!');
      window.location.href = 'index.html';
    }

    // HÀM QUAY LẠI TRANG CHỦ TỪ ADMIN
    function backToHome() {
      sessionStorage.clear();  // xóa hết dữ liệu phiên admin
      window.location.href = 'index.html';
    }

    // Load danh sách tin nhắn từ contact-messages.txt
    async function loadMessages() {
      try {
        const res = await fetch('../Backend/api/contact.php?action=list&t=' + Date.now());
        const data = await res.json();
        console.log('Feedback data:', data); // debug xem API trả gì

        const tbody = document.getElementById('messagesTable');

        if (!data.ok || !data.messages || data.messages.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No messages</td></tr>';
          return;
        }

            // ✅ Mỗi dòng có nút Delete
        tbody.innerHTML = data.messages.map(m => `
          <tr>
            <td><small class="text-muted">${m.time}</small></td>
            <td><strong>${m.name}</strong></td>
            <td>${m.phone}</td>
            <td>${m.year}</td>
            <td><small>${m.email}</small></td>
            <td>${m.role}</td>
            <td><small style="word-break:break-word;">${m.message}</small></td>
            <td class="text-center">
              <button class="btn btn-sm btn-danger" onclick="deleteMessage('${m.email || m.phone}')">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('messagesTable').innerHTML =
          '<tr><td colspan="8" class="text-center text-danger">Cannot load messages</td></tr>';
      }
    }


    
    async function deleteMessage(keyword) {
      if (!confirm(`Bạn có chắc muốn xóa feedback của "${keyword}" không?`)) return;

      const res = await fetch(`../Backend/api/contact.php?action=delete&keyword=${encodeURIComponent(keyword)}`);
      const data = await res.json();

      if (data.status === 'success') {
        alert('Đã xóa thành công!');
        loadMessages();
      } else {
        alert('Lỗi: ' + data.msg);
      }
    }


    // Load danh sách buổi phỏng vấn
    async function loadSessions() {
      const response = await fetch('../Backend/api/admin-api.php?action=list');
      const data = await response.json();
      
      const list = document.getElementById('sessionList');
      if (!data.ok || data.sessions.length === 0) {
        list.innerHTML = '<p class="text-center text-muted">No interview available.</p>';
        return;
      }

      list.innerHTML = data.sessions.map(s => `
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card session-card h-100" onclick="viewSession('${s.folder}')">
            <div class="card-body text-center">
              <h5 class="card-title">${s.userName}</h5>
              <p class="text-muted small">${s.folder}</p>
              <p class="text-muted small">${s.date}</p>
              <span class="badge bg-success">${s.questionsCount || 5} câu</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function viewSession(folder) {
      const res = await fetch(`../Backend/api/admin-api.php?action=view&folder=${folder}`);
      const data = await res.json();
      if (!data.ok) return;

      const s = data.session;
      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <div class="row">
          <div class="col-md-6">
            <h5>Information</h5>
            <p><strong>Full name:</strong> ${s.userName}</p>
            <p><strong>Time:</strong> ${s.startedAt || 'Unknown'}</p>
          </div>
          <div class="col-md-6">
            <h5>Video of each questions</h5>
            ${s.questions.map((q,i) => q.exists ? `
              <div class="mb-3">
                <strong>Câu ${i+1}:</strong><br>
                <video controls class="w-100" style="max-height:300px;">
                  <source src="../uploads/${folder}/${q.file}" type="video/webm">
                </video>
              </div>
            ` : '').join('')}
          </div>
        </div>
        <hr>
        <h5>Transcript</h5>
        <pre class="bg-light p-3 rounded" style="max-height:400px; overflow:auto;">${s.transcript || 'Chưa có transcript'}</pre>
      `;
      new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    // Load lần đầu + tự động cập nhật tin nhắn mỗi 5 giây
    loadSessions();
    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
